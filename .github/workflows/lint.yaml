name: Check quality OpenAPI

on: push

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Linting Rules
        run: redocly lint

  Test:
    needs: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tests
        run: redocly check-config

  Build:
    needs: Test
    run: redocly build-docs ../src/openAPI.yaml --output=index.html