openapi: 3.0.3

info:
  title: My Shopping List - OpenAPI 3.0
  version: 1.0.1

paths:
  /items:
    get:
      summary: List
      operationId: getItems
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/item-per-pages"
      responses:
        "200":
          description: A list of items to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "404":
          description: Items not found
        "500":
          description: Unexpected error

    post:
      summary: Add item 
      operationId: addItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Creation"
      responses:
        "201":
          description: Add item into a List
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "500":
          description: Unexpected error

  /item/{id}:
    put:
      summary: Edit List
      operationId: editList
      parameters:
        - name: id
          in: path
          required: true
          description: Modify an item in the list
          schema:
            type: integer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Creation"
      responses:
        "200":
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: Item not found
        "500":
          description: Unexpected error

components:
  parameters:
    page:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        default: 1

    item-per-pages:
      name: item-per-pages
      in: query
      description: Number of items per page
      schema:
        type: integer
        max: 10
        min: 1
        default: 3

  schemas:
    Common:
      type: object
      properties:
        ID:
          type: integer
          example : 2
        name:
          type: string
          example: Tomato
        details:
          type: object
          properties:
            type of food:
              type: string
              example: vegetable

    Creation:
      allOf:
        - $ref: "#/components/schemas/Common"

    ItemList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Common"
        page:
          type: integer
          example: 1
        item-per-pages:
          type: integer
          example: 2

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT